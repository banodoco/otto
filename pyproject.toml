[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "banodoco-otto"
dynamic = ["version"]
description = "An importable framework for Markdown-first organisations"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
otto = "otto.cli:main"

[tool.setuptools]
# The authored resource tree stays at the checkout root. Install only the
# listed data under the distribution's own namespace, not site-packages root.
packages = ["otto", "otto.skills", "otto._assets"]
include-package-data = false

[tool.setuptools.package-dir]
"otto._assets" = "."

[tool.setuptools.package-data]
"otto._assets" = [
    "templates/*/*.toml",
    "templates/*/*.md",
    "guidance/*.md",
    "guidance/*/*.md",
    "docs/contract.md",
]

[tool.setuptools.dynamic]
version = {attr = "otto.__version__"}
